services:
  - type: web
    name: careerai
    env: python
    region: oregon
    plan: free
    runtime: python-3.11
    buildCommand: pip install -r careerai/requirements.txt
    startCommand: cd careerai && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        generateValue: false
